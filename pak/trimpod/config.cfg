# Trimpod default config — auto-applies the 1ST_GEN_REMIX theme on first boot.
# Loaded by Rockbox at startup as ROCKBOX_DIR/config.cfg (/tmp/trimpod/config.cfg).
# Paths are pre-resolved to the live bind-mount path (/tmp/trimpod).
wps: /tmp/trimpod/wps/1ST_GEN_REMIX.wps
sbs: /tmp/trimpod/wps/1ST_GEN_REMIX.sbs
font: /tmp/trimpod/fonts/24-TrimpodUI.fnt
lang: russian
default codepage: cp1251
volume_ddb: -220
selector type: bar (inverse)
backdrop: -
background color: D8DCD0
foreground color: 181C18
statusbar: off
scrollbar: off
iconset: /tmp/trimpod/icons/1ST_GEN_REMIX_icons.bmp
viewers iconset: /tmp/trimpod/icons/1ST_GEN_REMIX_viewers.bmp
show icons: off
brightness: 3
idle poweroff: 0
backlight timeout: 20
viz start delay: 10
